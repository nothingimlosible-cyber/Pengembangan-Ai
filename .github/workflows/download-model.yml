name: Download AI Model to Repo
on: 
  workflow_dispatch: 

# INI KUNCINYA: Kasih izin buat nulis ke repo
permissions:
  contents: write

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Brain Folder
        run: mkdir -p brain/onnx

      - name: Download Model Files
        run: |
          cd brain
          curl -L -O https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/config.json
          curl -L -O https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/tokenizer.json
          curl -L -O https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/tokenizer_config.json
          cd onnx
          curl -L -O https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/onnx/model_quantized.onnx

      - name: Commit and Push Model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add brain/
          # Cek dulu ada perubahan gak, biar gak error kalau push kosong
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add local AI model files to brain folder" && git push)
