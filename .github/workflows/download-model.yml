      - name: Download Model AI (Versi Lengkap Anti-Blokir)
        run: |
          mkdir -p brain/onnx
          
          echo "Memulai download config..."
          curl -L -A "Mozilla/5.0" "https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/config.json" -o brain/config.json
          
          echo "Memulai download tokenizer..."
          curl -L -A "Mozilla/5.0" "https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/tokenizer.json" -o brain/tokenizer.json
          
          echo "Memulai download tokenizer config..."
          curl -L -A "Mozilla/5.0" "https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/tokenizer_config.json" -o brain/tokenizer_config.json
          
          echo "Memulai download OTAK UTAMA (ONNX)..."
          # Pakai --retry biar kalau gagal koneksi dia nyoba lagi otomatis
          curl -L -A "Mozilla/5.0" --retry 5 --retry-delay 2 "https://huggingface.co/Xenova/SmolLM-135M-Instruct/resolve/main/onnx/model_quantized.onnx" -o brain/onnx/model_quantized.onnx
          
          echo "Download selesai. Mengecek ukuran file..."
          ls -lh brain/onnx/
