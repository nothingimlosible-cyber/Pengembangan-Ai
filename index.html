<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Intelligence - Alan</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-area { padding: 15px; background: #111; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; outline: none; }
        button { padding: 12px; background: #4285f4; border: none; color: #fff; border-radius: 8px; font-weight: bold; }
        .msg { padding: 12px; border-radius: 12px; max-width: 85%; line-height: 1.5; }
        .user { background: #1a73e8; align-self: flex-end; }
        .ai { background: #222; align-self: flex-start; border: 1px solid #333; }
        #status { font-size: 11px; color: #666; text-align: center; padding: 5px; }
    </style>
</head>
<body>

<div id="status">Mengontak memori lokal...</div>
<div id="chat">
    <div class="msg ai">Halo Alan! Aku siap mikir pake model di folder brain/onnx.</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Tanya Alan Project...">
    <button id="sendBtn">KIRIM</button>
</div>

<script type="module">
    // Kita pake library langsung dari CDN
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // PENTING: GitHub Pages butuh path yang jelas
    env.allowRemoteModels = false;
    env.localModelPath = './'; 

    let model = null;
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');

    async function init() {
        try {
            status.innerText = "Sistem sedang memuat file ONNX...";
            
            // Kita tembak langsung folder 'brain'
            // Pastikan di repo kamu folder 'brain' isinya config.json 
            // Dan ada subfolder 'onnx' isinya model_quantized.onnx
            model = await pipeline('text-generation', 'brain', {
                model_file_name: 'onnx/model_quantized' 
            });

            status.innerText = "SISTEM AKTIF (GitHub Pages)";
        } catch (e) {
            status.innerText = "Gagal akses folder. Pastikan folder 'brain' sudah di-push.";
            console.error(e);
        }
    }
    init();

    async function chatSekarang() {
        const text = input.value.trim();
        if (!text || !model) return;

        appendMsg(text, 'user');
        input.value = '';
        const aiMsg = appendMsg("...", 'ai');

        try {
            const prompt = `<|im_start|>system\nKamu Core Intelligence.\n<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            const out = await model(prompt, { max_new_tokens: 100, temperature: 0.7 });
            aiMsg.innerText = out[0].generated_text.split('assistant\n')[1].trim();
        } catch (err) {
            aiMsg.innerText = "RAM HP penuh atau file onnx rusak.";
        }
    }

    function appendMsg(t, s) {
        const d = document.createElement('div');
        d.className = `msg ${s}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }

    btn.onclick = chatSekarang;
    input.onkeypress = (e) => { if(e.key === 'Enter') chatSekarang(); };
</script>

</body>
</html>
