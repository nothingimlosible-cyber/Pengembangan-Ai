<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Intelligence</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-area { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #4285f4; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .user { background: #1a73e8; align-self: flex-end; }
        .ai { background: #262626; align-self: flex-start; border: 1px solid #333; }
        #status { font-size: 12px; color: #888; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="chat">
    <div id="status">Menghubungkan ke folder brain/onnx...</div>
    <div class="msg ai">Halo Alan! Sistem siap digunakan.</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Tanya sesuatu...">
    <button id="sendBtn">KIRIM</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // KUNCI: Paksa pake folder 'brain' di GitHub kamu
    env.allowRemoteModels = false;
    env.localModelPath = './';

    let model = null;
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');

    // Fungsi bangunin otak dari folder lokal
    async function loadModel() {
        try {
            status.innerText = "Sedang memuat otak lokal (20MB)...";
            model = await pipeline('text-generation', 'brain', {
                quantized: true,
                model_file_name: 'onnx/model_quantized.onnx'
            });
            status.innerText = "Sistem Aktif (Lokal)";
        } catch (e) {
            status.innerText = "Gagal akses folder 'brain'. Pastikan file model ada di sana.";
            console.error(e);
        }
    }
    loadModel();

    async function kirimChat() {
        const text = input.value.trim();
        if (!text || !model) return;

        // Tampilkan pesan user
        appendMsg(text, 'user');
        input.value = '';

        // Tampilkan loading AI
        const aiMsg = appendMsg("...", 'ai');

        try {
            const prompt = `<|im_start|>system\nKamu Core Intelligence, asisten cerdas Alan.\n<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            
            const out = await model(prompt, { 
                max_new_tokens: 120, 
                temperature: 0.7 
            });

            aiMsg.innerText = out[0].generated_text.split('assistant\n')[1].trim();
        } catch (err) {
            aiMsg.innerText = "RAM penuh atau folder tidak terbaca.";
        }
        chat.scrollTop = chat.scrollHeight;
    }

    function appendMsg(t, s) {
        const d = document.createElement('div');
        d.className = `msg ${s}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }

    btn.onclick = kirimChat;
    input.onkeypress = (e) => { if(e.key === 'Enter') kirimChat(); };
</script>

</body>
</html>
